# electron-builder config
# pnpm monorepo: workspace deps (@zyquor/*) are symlinks in node_modules.
# electron-builder copies symlinks as-is, which become dead in the asar.
# Strategy: prepack script (scripts/prepack-zyq.mjs) resolves symlinks by
# copying built workspace packages into apps/desktop/node_modules/@zyquor/*
# as real directories before electron-builder runs.
# Native pnpm support in electron-builder is evolving; this is the reliable
# path for pnpm v10 workspaces.

appId: so.brace.zyquor
productName: Zyquor

publish:
  provider: github
  owner: haroon0x
  repo: zyquor

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - node_modules/**
  - package.json
  - "!dist/**/*.map"
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!src/**"
  - "!node_modules/@zyquor/*/src/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/docs/**"
  - "!**/examples/**"
  - "!**/data/**"
  - "!node_modules/.cache"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/typescript/**"

asar: true

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

win:
  # Cross-build from Linux/WSL without wine: skip exe resource editing/signing.
  # Exe keeps default Electron metadata; harmless on windows-latest CI too.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  createDesktopShortcut: false
  createStartMenuShortcut: false

linux:
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64
