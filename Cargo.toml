[workspace]
resolver = "3"
members = [
  "crates/zyquor-core",
  "crates/zyquor-accounts",
  "crates/zyquor-storage",
  "crates/zyquor-generation",
  "crates/zyquor-adapters",
  "crates/zyquor-automation",
  "crates/zyquor-browser",
  "apps/api",
  "apps/worker",
  "apps/desktop",
  "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = "0.8"
chrono = "0.4"
chromiumoxide = "0.8"
fancy-regex = "0.14"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "signal",
  "time",
] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
url = "2"

zyquor-core = { path = "crates/zyquor-core" }
zyquor-accounts = { path = "crates/zyquor-accounts" }
zyquor-storage = { path = "crates/zyquor-storage" }
zyquor-generation = { path = "crates/zyquor-generation" }
zyquor-adapters = { path = "crates/zyquor-adapters" }
zyquor-automation = { path = "crates/zyquor-automation" }
zyquor-browser = { path = "crates/zyquor-browser" }
zyquor-api = { path = "apps/api" }
zyquor-worker = { path = "apps/worker" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
