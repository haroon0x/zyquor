[workspace]
resolver = "3"
members = [
  "crates/zyquor-core",
  "crates/zyquor-accounts",
  "crates/zyquor-storage",
  "crates/zyquor-generation",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

zyquor-core = { path = "crates/zyquor-core" }
zyquor-accounts = { path = "crates/zyquor-accounts" }
zyquor-storage = { path = "crates/zyquor-storage" }
zyquor-generation = { path = "crates/zyquor-generation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
