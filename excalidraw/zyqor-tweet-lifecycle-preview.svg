<text x="70.0" y="76.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="38.0" fill="#111827">Zyqor — tweet lifecycle and states</text>
<text x="70.0" y="114.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">This view shows what happens to one piece of content from creation through posting or failure.</text>
<text x="84.0" y="220.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#6741d9">Main content lifecycle</text>
<text x="84.0" y="820.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#e8590c">Mode branches</text>
<text x="240.0" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">manual</text>
<text x="700.0" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">auto</text>
<text x="1162.5" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">reject</text>
<text x="1612.5" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">prepare</text>
<text x="2062.5" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">schedule</text>
<text x="2512.5" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">post</text>
<text x="2950.0" y="727.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">error</text>
<text x="106.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#1971c2">Input</text>
<text x="106.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">idea / source / reply</text>
<text x="451.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#1971c2">Source packet</text>
<text x="451.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">new → drafted</text>
<text x="796.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#1971c2">Draft</text>
<text x="796.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">created → generated</text>
<text x="1141.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Candidates</text>
<text x="1141.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">1 or 3 texts</text>
<text x="1486.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Quality</text>
<text x="1486.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">pass / reject</text>
<text x="1831.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Approval</text>
<text x="1831.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">selected + edited</text>
<text x="2176.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Job</text>
<text x="2176.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">approved → queued</text>
<text x="2521.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c2255c">Attempt</text>
<text x="2521.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">running → verified</text>
<text x="2866.0" y="408.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#495057">History</text>
<text x="2866.0" y="450.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">posted snapshot</text>
<text x="116.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#1971c2">Review required</text>
<text x="116.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">User chooses, edits,</text>
<text x="116.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">then approves</text>
<text x="566.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">YOLO</text>
<text x="566.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">One candidate</text>
<text x="566.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Auto-approve if gates pass</text>
<text x="1016.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Quality failure</text>
<text x="1016.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Stay in review</text>
<text x="1016.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Visible in quality failures</text>
<text x="1466.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c2255c">Prepare only</text>
<text x="1466.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Worker inserts text</text>
<text x="1466.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">User clicks Post</text>
<text x="1916.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Scheduled</text>
<text x="1916.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Wait until due</text>
<text x="1916.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Prepare, then user acts</text>
<text x="2366.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Autopost</text>
<text x="2366.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Auto-approved job</text>
<text x="2366.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Worker posts when due</text>
<text x="2816.0" y="968.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Browser failure</text>
<text x="2816.0" y="1010.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Job failed</text>
<text x="2816.0" y="1032.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Screenshot / trace saved</text>
<text x="2816.0" y="1055.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">No blind retry</text>
<text x="100.0" y="1210.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">Draft states: created, generated, selected, approved, archived.</text>
<text x="100.0" y="1255.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">Job states: created, approved, queued, running, prepared, posted, failed, cancelled.</text>
<text x="1100.0" y="1210.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">Attempt states: started, compose opened, text inserted, post clicked, verified, failed.</text>
<text x="1100.0" y="1255.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">A successful post creates history and normally removes the source packet while retaining its source snapshot.</text>
</svg>
