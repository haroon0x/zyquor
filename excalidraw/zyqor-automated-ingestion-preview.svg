<text x="1911.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Route type</text>
<text x="1911.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Mix or inferred type</text>
<text x="2126.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Generate</text>
<text x="2126.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Several candidates</text>
<text x="2341.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Quality</text>
<text x="2341.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Source + text gates</text>
<text x="2626.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">One final job</text>
<text x="2626.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Best passing candidate</text>
<text x="2626.0" y="532.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Auto-approved autopost</text>
<text x="2916.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Due worker</text>
<text x="2916.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">No schedule: random gap</text>
<text x="2916.0" y="532.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Account + limit checks</text>
<text x="2916.0" y="738.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c2255c">Chrome + X</text>
<text x="2916.0" y="780.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Insert, verify, click</text>
<text x="2916.0" y="802.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Save permalink</text>
<text x="116.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Daily target</text>
<text x="116.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Usually 3–4 packets</text>
<text x="116.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Hard cap of 4</text>
<text x="466.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Freshness</text>
<text x="466.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Published within ~48h</text>
<text x="466.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Future items rejected</text>
<text x="816.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Topic filter</text>
<text x="816.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">AI / dev / tools focus</text>
<text x="816.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Broad off-topic skipped</text>
<text x="1166.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Duplication</text>
<text x="1166.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Posted URL</text>
<text x="1166.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Current run • same host</text>
<text x="1516.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Thin sources</text>
<text x="1516.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Need facts or summary</text>
<text x="1516.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Otherwise review / skip</text>
<text x="1866.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Source health</text>
<text x="1866.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Errors cool down</text>
<text x="1866.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Run records errors</text>
<text x="2216.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Provider failure</text>
<text x="2216.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Ingest run stops</text>
<text x="2216.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Packet is cleaned up</text>
<text x="2566.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Quality failure</text>
<text x="2566.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Draft remains for review</text>
<text x="2566.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Feedback can regenerate</text>
<text x="2916.0" y="1228.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#c92a2a">Post failure</text>
<text x="2916.0" y="1270.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Job fails + artifacts</text>
<text x="2916.0" y="1292.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">No automatic retry</text>
<text x="100.0" y="1482.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#111827">Automatic ingest approves the best passing candidate. Actual public posting still requires the worker, a runnable account, a logged-in dedicated profile, and browser posting enabled.</text>
<text x="100.0" y="1535.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">Manual source-packet auto-approval has extra controls. Automatic ingest and manual packet creation do not have identical approval behavior.</text>
