<text x="116.0" y="410.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Enabled + time window</text>
<text x="116.0" y="432.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Daily max + type mix</text>
<text x="436.0" y="308.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#2b8a3e">Aggregated news</text>
<text x="436.0" y="350.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">HN • Reddit • RSS</text>
<text x="436.0" y="372.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">TechCrunch • arXiv</text>
<text x="436.0" y="598.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#2b8a3e">Optional feeds</text>
<text x="436.0" y="640.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Product Hunt token</text>
<text x="436.0" y="662.5" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Custom RSS + hiring</text>
<text x="836.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#6741d9">Fetch</text>
<text x="836.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">Adapters return items</text>
<text x="1051.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Fresh + topic</text>
<text x="1051.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">~48h + on topic</text>
<text x="1266.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#e8590c">Dedupe + caps</text>
<text x="1266.0" y="510.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#343a40">URLs • host • source</text>
<text x="1481.0" y="468.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22.0" fill="#2b8a3e">Enrich</text>
