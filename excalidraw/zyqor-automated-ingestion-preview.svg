<text x="70.0" y="76.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="38.0" fill="#111827">Zyqor — automated ingestion and autopost workflow</text>
<text x="70.0" y="114.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20.0" fill="#495057">The worker turns fresh external sources into a small number of source-backed autopost jobs.</text>
<text x="84.0" y="220.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#2b8a3e">Source collection</text>
<text x="814.0" y="220.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#6741d9">Selection and content creation</text>
<text x="2614.0" y="220.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#c2255c">Scheduling and posting</text>
<text x="84.0" y="1130.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24.0" fill="#e8590c">Rules and failure behavior</text>
<text x="750.0" y="437.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">items</text>
<text x="750.0" y="572.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">items</text>
<text x="2532.5" y="502.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">best</text>
<text x="2880.0" y="502.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18.0" fill="#495057">schedule</text>
