name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `tauri::generate_context!` embeds `frontendDist` at compile time, so
      # `apps/desktop` cannot be checked until the renderer is built.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the React renderer (Tauri frontendDist)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Desktop bundles are built on a tag (for the release job) or on a manual
  # dispatch (to exercise the pipeline without publishing). They wait for
  # `web` + `rust`, so a red tree can never produce release assets.
  desktop-win:
    needs: [web, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the React renderer (Tauri frontendDist)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # Optional release signing (docs/code-signing.md). Nothing is signed
      # unless repository secrets are configured:
      #   - Windows Authenticode: WINDOWS_CERTIFICATE (base64 or PEM-armored
      #     PFX) + WINDOWS_CERTIFICATE_PASSWORD; optional repo variable
      #     WINDOWS_TIMESTAMP_URL (CA timestamp server).
      #   - Tauri updater artifacts: TAURI_SIGNING_PRIVATE_KEY (base64 key
      #     contents or a path) + TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
      # No certificate or key material belongs in this repository. Half a
      # secret pair fails the job instead of publishing a broken release.
      - name: Prepare optional release signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasCertPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          $hasUpdaterKey = -not [string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY)
          $hasUpdaterPassword = -not [string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY_PASSWORD)

          if ($hasCert -xor $hasCertPassword) {
            throw "Set both WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or neither."
          }
          if ($hasUpdaterKey -xor $hasUpdaterPassword) {
            throw "Set both TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, or neither."
          }

          $overlay = [ordered]@{}
          if ($hasCert) {
            # Accept plain base64 or certutil/PEM-armored base64 for the PFX.
            $base64 = ($env:WINDOWS_CERTIFICATE -replace '-----[^-]+-----', '') -replace '\s', ''
            $pfxPath = Join-Path $env:RUNNER_TEMP 'zyquor-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
            try {
              $pfx = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $pfxPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
              $thumbprint = $pfx.Thumbprint
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
              Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword | Out-Null
            } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }

            $certificate = Get-ChildItem -Path Cert:\CurrentUser\My |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Select-Object -First 1
            if (-not $certificate -or -not $certificate.HasPrivateKey) {
              throw "Imported certificate $thumbprint is missing from Cert:\CurrentUser\My or has no private key."
            }

            $windows = [ordered]@{
              certificateThumbprint = $thumbprint
              digestAlgorithm = 'sha256'
            }
            if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
              $windows.timestampUrl = $env:WINDOWS_TIMESTAMP_URL
            } else {
              Write-Host "WINDOWS_TIMESTAMP_URL is not set; signatures will expire with the certificate."
            }
            $overlay['bundle'] = [ordered]@{ windows = $windows }
            Write-Host "Authenticode signing enabled for certificate $thumbprint."
          }

          if ($hasUpdaterKey) {
            if ($null -eq $overlay['bundle']) { $overlay['bundle'] = [ordered]@{} }
            $overlay['bundle']['createUpdaterArtifacts'] = $true
            Write-Host "Tauri updater artifact signing enabled."
          }

          $configPath = ''
          if ($overlay.Count -gt 0) {
            $configPath = Join-Path $env:RUNNER_TEMP 'zyquor-signing.conf.json'
            [IO.File]::WriteAllText($configPath, ($overlay | ConvertTo-Json -Depth 8))
          } else {
            Write-Host "No signing secrets configured; building unsigned bundles."
          }
          "authenticode_enabled=$($hasCert.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "updater_enabled=$($hasUpdaterKey.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "signed_enabled=$((($hasCert -or $hasUpdaterKey)).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "config_path=$configPath" >> $env:GITHUB_OUTPUT

      # Release tags must not publish unsigned installers once the repository
      # variable REQUIRE_WINDOWS_SIGNING=true is set (docs/code-signing.md).
      # Off until a real certificate exists.
      - name: Enforce signing on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.REQUIRE_WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.authenticode_enabled }}' -ne 'true') {
            throw "REQUIRE_WINDOWS_SIGNING is enabled but WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD are not set."
          }

      - name: Build the desktop bundles (unsigned)
        if: ${{ steps.signing.outputs.signed_enabled != 'true' }}
        run: cargo tauri build

      - name: Build the desktop bundles (signed)
        if: ${{ steps.signing.outputs.signed_enabled == 'true' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --config "${{ steps.signing.outputs.config_path }}"

      - name: Verify Authenticode signatures
        if: ${{ steps.signing.outputs.authenticode_enabled == 'true' }}
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem -Path target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($artifacts.Count -eq 0) {
            throw "No Windows installer artifacts found to verify."
          }
          foreach ($file in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.StatusMessage)"
            }
          }

      - name: Generate updater manifest (latest.json)
        if: ${{ steps.signing.outputs.updater_enabled == 'true' }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          python scripts/generate-updater-manifest.py `
            --bundle-dir target/release/bundle `
            --version $version `
            --repo "${{ github.repository }}" `
            --tag "${{ github.ref_name }}" `
            --output target/release/bundle/latest.json
          Get-ChildItem -Path target/release/bundle -Recurse -Filter *.sig |
            ForEach-Object { Write-Host "signature: $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        with:
          name: zyquor-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
            target/release/bundle/latest.json
          if-no-files-found: error

  desktop-linux:
    needs: [web, rust]
    # 22.04 keeps the glibc floor at 2.35 so the .deb runs on 22.04+ as well as
    # 24.04; a 24.04-built binary would demand glibc 2.39.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the React renderer (Tauri frontendDist)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # `bundle.active` is true in tauri.conf.json, so this produces
      # .deb, .rpm and .AppImage (targets: "all").
      - name: Build the desktop bundles
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: zyquor-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-macos:
    needs: [web, rust]
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the React renderer (Tauri frontendDist)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # Universal binary so the .dmg runs on Apple Silicon and Intel.
      # Unsigned: signing/notarization needs an Apple Developer identity
      # (docs/code-signing.md); Gatekeeper still warns until then.
      - name: Build the desktop bundles (universal, unsigned)
        run: cargo tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: zyquor-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Publishes the tag's installers as GitHub Release assets. Only runs for
  # `v*` tags, and only after every desktop bundle job succeeded. Release
  # assets are anonymous-downloadable; workflow artifacts are not.
  release:
    needs: [desktop-win, desktop-linux, desktop-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(python3 -c "import json;print(json.load(open('apps/desktop/tauri.conf.json'))['version'])")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match apps/desktop/tauri.conf.json version $version."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          files=(release-assets/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Zyquor $tag" \
              --generate-notes
          fi
