name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  # Windows desktop packaging — manual dispatch or on tags
  # No code signing yet.
  dist-desktop-win:
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @zyquor/web build
      - run: pnpm --filter @zyquor/desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: zyquor-setup-x64
          path: apps/desktop/release/*.exe
